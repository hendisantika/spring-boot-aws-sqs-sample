version: 2
updates:
  # Maven dependencies (pom.xml) + Maven Wrapper (.mvn/wrapper)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      aws-sdk:
        patterns:
          - "com.amazonaws:*"
          - "software.amazon.awssdk:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "com.amazonaws:*"
          - "software.amazon.awssdk:*"
          - "org.apache.maven.plugins:*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github_actions
    assignees:
      - hendisantika
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
